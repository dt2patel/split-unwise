    <style id="su-launch-style">
      /* Home-screen launch screen. Its first frame is identical to iOS's launch images (rendered from this markup), then it fades into the app. */
      .su-launch { position: fixed; inset: 0; z-index: 2147483000; display: none; background-color: #F8F7FF; background-image: radial-gradient(58% 34% at 50% calc(50% - var(--su-launch-shift, 0px)), rgba(105, 75, 232, .14), rgba(105, 75, 232, 0) 72%); pointer-events: none; }
      .su-launching .su-launch { display: block; }
      .su-launch__icon { position: absolute; left: 50%; top: calc(50% - var(--su-launch-shift, 0px)); width: 112px; height: 112px; margin: -56px 0 0 -56px; border-radius: 25px; box-shadow: 0 18px 38px rgba(38, 32, 127, .24), 0 3px 8px rgba(38, 32, 127, .14); }
      .su-launch__spinner { position: absolute; left: 50%; top: calc(50% - var(--su-launch-shift, 0px) + 92px); width: 26px; height: 26px; margin-left: -13px; color: #6A6878; opacity: 0; transition: opacity 320ms ease; }
      .su-launch__spinner svg { display: block; width: 100%; height: 100%; animation: su-launch-spin 1s steps(8) infinite; }
      .su-launch--slow .su-launch__spinner { opacity: 1; }
      .su-launch--leaving { opacity: 0; transition: opacity 280ms cubic-bezier(.2, .8, .2, 1); }
      .su-launch--leaving .su-launch__icon { transform: scale(1.08); transition: transform 280ms cubic-bezier(.2, .8, .2, 1); }
      @keyframes su-launch-spin { to { transform: rotate(360deg); } }
      @media (prefers-color-scheme: dark) {
        .su-launch { background-color: #17152A; background-image: radial-gradient(58% 34% at 50% calc(50% - var(--su-launch-shift, 0px)), rgba(168, 151, 255, .17), rgba(168, 151, 255, 0) 72%); }
        .su-launch__icon { box-shadow: 0 18px 42px rgba(0, 0, 0, .5), 0 3px 8px rgba(0, 0, 0, .32); }
        .su-launch__spinner { color: #9895A9; }
      }
      @media (prefers-reduced-motion: reduce) {
        .su-launch--leaving { transition-duration: 160ms; }
        .su-launch--leaving .su-launch__icon { transform: none; }
        .su-launch__spinner svg { animation-duration: 2s; }
      }
